services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./nexus-api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexus"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./nexus-api
    environment:
      DATABASE_URL: postgres://postgres:nexus@db:5432/nexus
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: